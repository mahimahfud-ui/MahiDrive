let ty=null,w=v.replace(/type:(\w+)/,(_,t)=>(ty=t,'')).trim();const dd=+$('#sd').value,sz=+$('#ss').value;
const r=F.filter(f=>!f.tr&&f.n.toLowerCase().includes(w)&&(!ty||f.t==ty||FL[ty]&&FL[ty](f.t)&&ty!='all')&&(!dd||f.d<=dd)&&(!sz||f.s>=sz)).slice(0,12);
box.innerHTML=r.length?r.map(f=>`<div class="rw nc" style="grid-template-columns:1fr 80px" tabindex="0" role="button" onclick="closeM();act('open',${f.id})"><div class="nm">${th(f)}<div><b>${f.n}</b><div class="mu">${path(f)=='/'?'My Files':path(f)}</div></div></div><span class="mu">${f.t=='folder'?'':fmt(f.s)}</span></div>`).join(''):empty('No results','Try another term or filter.');if(v&&!RS.includes(v))RS.unshift(v)}
// uploads
const pick=()=>A.map((a,i)=>[i,a]).filter(x=>x[1].s!='er').sort((a,b)=>(b[1].q-b[1].u)-(a[1].q-a[1].u))[0][0];
function addU(fl){[...fl].forEach(f=>U.push({n:f.name,s:f.size/1048576,p:0,st:'up',a:pick(),cwd:S.cwd}));go('uploads');toast(fl.length+' file(s) added to local demo')}
['fi','fo'].forEach(i=>$('#'+i).onchange=e=>{if(e.target.files.length)addU(e.target.files);e.target.value=''});
const ua=(i,s)=>{U[i].st=s;draw()};
const gt=n=>/\.(jpe?g|png|heic|gif|webp)$/i.test(n)?'img':/\.(mp4|mov|mkv)$/i.test(n)?'vid':/\.(mp3|wav|flac)$/i.test(n)?'aud':/\.pdf$/i.test(n)?'pdf':/\.docx?$/i.test(n)?'doc':/\.xlsx?$|\.csv$/i.test(n)?'xls':/\.pptx?$/i.test(n)?'ppt':/\.(zip|rar|7z)$/i.test(n)?'zip':/\.(js|ts|py|html|css|md|txt|json)$/i.test(n)?'code':'oth';
setInterval(()=>{let ch=0,act2=U.filter(u=>u.st=='up').length;U.forEach(u=>{if(u.st=='queue'&&act2<MAXU){u.st='up';act2++}if(u.st=='up'){u.p=Math.min(100,u.p+Math.random()*(u.s>500?3:14));u.sp=(2+Math.random()*6).toFixed(1)+' MB/s';ch=1;if(u.p>=100){u.st='done';if(!u.seed&&u.cwd!==undefined)mk(u.n,gt(u.n),u.s,0,u.cwd,u.a)}}});if(ch&&S.v=='uploads'&&!$('#md'))draw()},900);
let dc=0;addEventListener('dragenter',e=>{e.preventDefault();dc++;$('#drop').classList.add('on')});addEventListener('dragleave',()=>{if(--dc<=0){dc=0;$('#drop').classList.remove('on')}});addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>{e.preventDefault();dc=0;$('#drop').classList.remove('on');if(e.dataTransfer.files.length)addU(e.dataTransfer.files)});
addEventListener('keydown',e=>{const tg=e.target.tagName,typing=tg=='INPUT'||tg=='SELECT';
if((e.metaKey||e.ctrlKey)&&e.key=='k'||(e.key=='/'&&!typing)){e.preventDefault();openSearch()}
else if(e.key=='Escape'){if($('#cm'))closeCtx();else if($('#md'))closeM();else if($('#pv'))$('#pv').remove();else app.classList.remove('mo')}
else if(!typing&&(e.metaKey||e.ctrlKey)&&e.key=='a'&&['files','starred'].includes(S.v)){e.preventDefault();selAll()}
else if(!typing&&e.key=='Delete'&&S.sel.size)selAct('del')});
$('#c').innerHTML='<div class="g g2"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>';syncSq();setTimeout(()=>{draw();enter()},350);
function enter(){const c=$('#c');c.classList.add('anim');c.querySelectorAll(':scope>*').forEach((e,i)=>e.style.setProperty('--i',i));c.querySelectorAll('.fc,.rw').forEach((e,i)=>e.style.setProperty('--i',Math.min(i,16)+2));clearTimeout(enter.t);enter.t=setTimeout(()=>c.classList.remove('anim'),1400);
if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;c.querySelectorAll('.ring b,.cd h1').forEach(el=>{const m=el.textContent.match(/^([\d.]+)(.*)$/);if(!m)return;const to=+m[1],d=(m[1].split('.')[1]||'').length,t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/1000),e=1-Math.pow(1-k,3);el.textContent=(to*e).toFixed(d)+m[2];if(k<1)requestAnimationFrame(f)})(t0)})}
document.addEventListener('pointermove',e=>{const c=e.target.closest&&e.target.closest('.cd');if(c){const r=c.getBoundingClientRect();c.style.setProperty('--mx',e.clientX-r.left+'px');c.style.setProperty('--my',e.clientY-r.top+'px')}});
